<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: Lecture 8, Propulsion Selection and Integration</title>
<style>
  /* The color variables match the quick checks (quickcheck/*.html). Change them together. */
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #4b5563; --card: #ffffff; --border: #d9d6ce;
    --head-bg: #f7f5f0; --head-fg: #111827; --accent: #6f5630; --accent-border: #cfb991;
    --input-bg: #ffffff; --input-border: #6b7280; --ok: #0a6b3d; --bad: #b42318;
    --button: #111827; --button-fg: #ffffff; --sol-bg: #f7f5f0;
    --link: #1d4ed8; --focus: #1d4ed8;
  }
  html.dark {
    --bg: #1c1917; --fg: #e5e7eb; --muted: #b7bcc6; --card: #292524; --border: #44403c;
    --head-bg: #363231; --head-fg: #ffffff; --accent: #cfb991; --accent-border: #cfb991;
    --input-bg: #1c1917; --input-border: #9ca3af; --ok: #6ee7b7; --bad: #fca5a5;
    --button: #cfb991; --button-fg: #000000; --sol-bg: #363231;
    --link: #93c5fd; --focus: #93c5fd;
  }
  html.dark { color-scheme: dark; }   /* native radio buttons drawn for a dark page */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { border: 1px solid var(--border); border-left: 5px solid var(--accent-border); border-radius: 8px;
          background: var(--card); overflow: hidden; }
  .head { background: var(--head-bg); color: var(--head-fg); padding: 10px 16px; font-weight: 700; font-size: 1.15em;
          display: flex; align-items: center; gap: 10px; }
  .head svg { width: 22px; height: 22px; flex: none; }
  .body { padding: 16px; }
  i { font-style: italic; }
  sub, sup { font-size: 0.75em; }
  .ov { text-decoration: overline; }
  .progress { margin: 0 0 6px; color: var(--muted); font-size: 0.95em; }
  .progress:focus { outline: none; }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 0 0 14px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent-border); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; margin: 0 0 4px; font-size: 1.08em; font-weight: 600; color: var(--head-fg); }
  .opt { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 10px; padding: 10px 12px; margin: 8px 0 0;
         border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); cursor: pointer; }
  .opt input { flex: none; width: 1.05em; height: 1.05em; margin: 0.25em 0 0; accent-color: var(--button); }
  .opt .text { flex: 1 1 12em; }
  .opt .tag { flex: none; font-weight: 600; font-size: 0.92em; }
  .opt:hover { border-color: var(--fg); }
  .opt:has(input:checked) { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 1px; }
  .locked .opt { cursor: default; }
  .locked .opt:hover { border-color: var(--input-border); }
  .locked .opt.right, .locked .opt.right:hover { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .locked .opt.wrong, .locked .opt.wrong:hover { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .opt.right .tag { color: var(--ok); }
  .opt.wrong .tag { color: var(--bad); }
  .feedback { margin: 14px 0 0; }
  .feedback.show { border: 1px solid var(--border); border-left: 4px solid var(--accent-border); border-radius: 6px;
                   background: var(--sol-bg); padding: 10px 14px; }
  .verdict { font-weight: 700; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .buttons { display: flex; gap: 12px; margin: 16px 0 0; }
  button { font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 6px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--button); color: var(--button-fg); border: 1px solid var(--button); }
  .score { margin: 0 0 8px; font-size: 1.15em; font-weight: 700; color: var(--head-fg); }
  .score:focus { outline: none; }
  .result p { margin: 8px 0; }
  .result ul { margin: 8px 0 0; padding-left: 1.3em; }
  .result li { margin: 4px 0; }
  a { color: var(--link); }
  a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 10l1.5 1.5L13.5 8.5M9 16h6"/></svg>
    Quiz: Lecture 8, Propulsion Selection and Integration
  </div>
  <div class="body">
    <noscript><p>The quiz needs JavaScript.</p></noscript>
    <p class="progress" id="progress" tabindex="-1"></p>
    <div class="bar" aria-hidden="true"><span id="fill"></span></div>
    <form id="quiz" novalidate>
      <fieldset>
        <legend id="legend"></legend>
        <div id="opts"></div>
      </fieldset>
      <div class="feedback" id="feedback" role="status"></div>
      <div class="buttons">
        <button type="submit" class="primary" id="go">Check answer</button>
      </div>
    </form>
    <div class="result" id="result" hidden>
      <p class="score" id="score" tabindex="-1"></p>
      <p id="reviewIntro">Review these sections, then start over:</p>
      <ul id="review"></ul>
      <div class="buttons">
        <button type="button" class="primary" id="again">Start over</button>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="data">{"questions": [{"page": "engine-selection", "pageTitle": "Engine selection", "section": "Propulsive efficiency", "question": "An invented engine with an exit speed <i>V<sub>e<\/sub><\/i> = 3<i>V<sub>∞<\/sub><\/i> has <i>η<sub>prop<\/sub><\/i> = 0.50. What is <i>η<sub>prop<\/sub><\/i> of a second engine that gives the same thrust at the same flight speed with twice the mass flow?", "options": ["0.67", "0.80", "0.50", "0.33"], "explanation": "At the same thrust, twice the mass flow needs half the velocity change: <i>V<sub>e<\/sub><\/i> − <i>V<sub>∞<\/sub><\/i> falls from 2<i>V<sub>∞<\/sub><\/i> to <i>V<sub>∞<\/sub><\/i>, so <i>V<sub>e<\/sub><\/i> = 2<i>V<sub>∞<\/sub><\/i> and <i>η<sub>prop<\/sub><\/i> = 2/(1 + 2) = 0.67. Halving <i>V<sub>e<\/sub><\/i> itself gives 0.80."}, {"page": "engine-selection", "pageTitle": "Engine selection", "section": "Turbojet and turbofan", "question": "Two turbofans have the same sea-level static thrust. What does the one with the higher bypass ratio have?", "options": ["Lower TSFC, a larger fan, and thrust that falls faster with Mach number", "Lower TSFC, a smaller fan, and thrust that falls faster with Mach number", "Lower TSFC, a larger fan, and thrust that falls more slowly with Mach number", "Higher TSFC, a larger fan, and thrust that falls more slowly with Mach number"], "explanation": "More bypass air is a larger mass flow with a smaller velocity change, which lowers the TSFC and needs a larger fan. The cost is thrust that falls faster as Mach number rises."}, {"page": "engine-models", "pageTitle": "Engine models and the engine deck", "section": "Thrust lapse of a turbofan", "question": "The sea-level curves of the turbofan thrust lapse show a break as Mach number rises. What does the break mark?", "options": ["<i>θ<sub>0<\/sub><\/i> reaches <i>TR<\/i>, and the turbine entry temperature is at its limit", "The nozzle chokes, and the exit Mach number stays at 1 from there on", "The ram pressure stops rising, and <i>δ<sub>0<\/sub><\/i> stays constant from there on", "The flow at the inlet lip goes sonic, and a shock lowers the recovery"], "explanation": "The throttle ratio <i>TR<\/i> is the value of <i>θ<sub>0<\/sub><\/i> at which the turbine entry temperature reaches its limit. Above it, the term in <i>θ<sub>0<\/sub><\/i> − <i>TR<\/i> enters the relation and takes thrust away."}, {"page": "engine-models", "pageTitle": "Engine models and the engine deck", "section": "A published engine deck: the FJ44-3E", "question": "On an engine deck, TSFC is flat near full throttle and rises steeply at low throttle settings. A sizing code uses one TSFC value, read near full throttle, for every segment. What is the effect on the mission fuel?", "options": ["It underestimates the fuel of the descent and the loiter", "It overestimates the fuel of the descent and the loiter", "It underestimates the fuel of the takeoff and the climb", "It overestimates the fuel of the takeoff and the climb"], "explanation": "The descent and the loiter are flown at low throttle settings, where the TSFC is well above the full-throttle value. Takeoff and climb are near full throttle, where the curve is flat and the throttle setting adds little error."}, {"page": "engine-models", "pageTitle": "Engine models and the engine deck", "section": "Thrust sizing", "question": "The equation for the maximum sustained load factor <i>n<sub>MS<\/sub><\/i> contains <i>T/W<\/i> and <i>W/S<\/i>. For a turn at altitude, partway through the mission, which thrust and weight go in?", "options": ["The thrust and the weight at that flight condition", "The sea-level static thrust and the takeoff weight", "The sea-level static thrust and the weight at that condition", "The thrust at that flight condition and the takeoff weight"], "explanation": "<i>T/W<\/i> and <i>W/S<\/i> in the equation are the values at the flight condition. Carrying (<i>T/W<\/i>)<sub>TO<\/sub> into it skips the thrust lapse and the fuel burned."}, {"page": "engine-integration", "pageTitle": "Inlet, nozzle, and the design sequence", "section": "Jet inlet: the capture area", "question": "An invented aircraft has an inlet sized at its cruise condition, so the lip area is about the area of the cruise streamtube. What does the takeoff check find?", "options": ["The streamtube is wider than the lip, so the inlet needs rounded lips and perhaps doors", "The streamtube is narrower than the lip, so the lip area can be reduced further", "The streamtube has the same area as the lip, so the takeoff check changes nothing", "The streamtube is wider than the lip, so the diffuser must be made longer"], "explanation": "The demand capture area is the airflow divided by 32.17<i>ρ<sub>∞<\/sub>V<sub>∞<\/sub><\/i>, so it grows as the flight speed falls. At takeoff the engine draws air from a region wider than a lip sized for cruise, and the air has to turn around the lip."}, {"page": "engine-integration", "pageTitle": "Inlet, nozzle, and the design sequence", "section": "Diffuser: duct length and recovery", "question": "A layout shortens the inlet diffuser to save fuselage length, with the throat diameter <i>D<sub>t<\/sub><\/i> and the compressor-face diameter <i>D<sub>f<\/sub><\/i> unchanged. What is the risk?", "options": ["The included angle goes above 10° and the flow can separate", "The compressor-face Mach number goes above the 0.4 to 0.5 band", "The demand capture area becomes smaller than the lip area", "The fuselage boundary layer enters the inlet at the lip"], "explanation": "With <i>D<sub>f<\/sub><\/i> − <i>D<sub>t<\/sub><\/i> fixed, a shorter length <i>L<\/i> gives a larger included angle <i>θ<\/i>. The 10° limit keeps the diffuser below the angle at which the flow separates."}, {"page": "engine-integration", "pageTitle": "Inlet, nozzle, and the design sequence", "section": "Nozzle: what to check", "question": "A team has an uninstalled deck and an installed deck. To which one does it apply its inlet pressure recovery and its nozzle coefficient in full?", "options": ["An uninstalled deck only, since an installed deck already includes them", "An installed deck only, since an uninstalled deck has no inlet or nozzle", "Both decks, since the two losses change with Mach number", "Neither deck, since both losses belong in the drag build-up"], "explanation": "An installed deck already carries a pressure recovery and a nozzle coefficient, so applying the team's values again counts each loss twice. If the team's recovery is below the one the deck assumed, only the difference costs thrust. The boattail drag is the item that goes in the drag build-up."}]}</script>
<script>
(function () {
  function syncTheme() {
    var dark = false;
    try { dark = window.parent.document.documentElement.classList.contains("dark"); }
    catch (e) { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (Math.ceil(document.body.getBoundingClientRect().height) + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var Q = JSON.parse(document.getElementById("data").textContent).questions;
  var n = Q.length, i = 0, answered = false, right = [];
  var el = {};
  ["progress", "fill", "quiz", "legend", "opts", "feedback", "go", "result", "score", "reviewIntro", "review", "again"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Show question i. The options are drawn in a new order each time; option 0 is the correct one.
  function show(moveFocus) {
    var q = Q[i];
    answered = false;
    el.progress.textContent = "Question " + (i + 1) + " of " + n;
    el.fill.style.width = (100 * i / n) + "%";
    el.legend.innerHTML = q.question;
    el.opts.innerHTML = "";
    el.opts.className = "";
    shuffle([0, 1, 2, 3]).forEach(function (k) {
      var label = document.createElement("label"), input = document.createElement("input"),
          text = document.createElement("span"), tag = document.createElement("span");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = String(k);
      text.className = "text"; text.innerHTML = q.options[k];
      tag.className = "tag";
      label.appendChild(input); label.appendChild(text); label.appendChild(tag);
      el.opts.appendChild(label);
    });
    el.feedback.className = "feedback";
    el.feedback.textContent = "";
    el.go.textContent = "Check answer";
    el.result.hidden = true;
    el.quiz.hidden = false;
    if (moveFocus) el.progress.focus();
  }

  function check() {
    var chosen = el.quiz.querySelector("input[name=answer]:checked");
    if (!chosen) {
      el.feedback.className = "feedback show";
      el.feedback.textContent = "Choose an answer first.";
      return;
    }
    answered = true;
    right[i] = chosen.value === "0";
    Array.prototype.forEach.call(el.opts.querySelectorAll("label"), function (label) {
      var input = label.querySelector("input"), tag = label.querySelector(".tag");
      if (input.value === "0") { label.classList.add("right"); tag.textContent = "✓ correct answer"; }
      else if (input.checked) { label.classList.add("wrong"); tag.textContent = "✗ your answer"; }
      input.disabled = true;
    });
    el.opts.className = "locked";
    el.feedback.className = "feedback show";
    el.feedback.innerHTML = '<span class="verdict ' + (right[i] ? "ok" : "bad") + '">' +
      (right[i] ? "Correct." : "Not correct.") + "</span> " + Q[i].explanation;
    el.go.textContent = i + 1 < n ? "Next question" : "See your score";
    el.go.focus();
  }

  function finish() {
    var count = right.filter(Boolean).length;
    el.progress.textContent = "Result";
    el.fill.style.width = "100%";
    el.score.textContent = count === n ? "All " + n + " correct." : count + " of " + n + " correct.";
    el.review.innerHTML = "";
    el.reviewIntro.hidden = count === n;
    Q.forEach(function (q, j) {
      if (right[j]) return;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "../" + q.page + "/"; a.target = "_top"; a.textContent = q.pageTitle;
      li.appendChild(document.createTextNode("Question " + (j + 1) + ": "));
      li.appendChild(a);
      li.appendChild(document.createTextNode(", section “" + q.section + "”"));
      el.review.appendChild(li);
    });
    el.quiz.hidden = true;
    el.result.hidden = false;
    el.score.focus();
  }

  el.quiz.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!answered) { check(); return; }
    i++;
    if (i < n) show(true); else finish();
  });
  el.again.addEventListener("click", function () { i = 0; right = []; show(true); });
  show(false);
})();
</script>
</body>
</html>
