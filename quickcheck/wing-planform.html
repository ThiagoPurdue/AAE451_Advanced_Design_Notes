<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick check: planform from S, AR and λ</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #4b5563; --card: #ffffff; --border: #c9ced6;
    --head-bg: #ede9f6; --head-fg: #2f1f5e; --accent: #5a3e9c; --accent-border: #5a3e9c;
    --input-bg: #ffffff; --input-border: #6b7280; --ok: #0a6b3d; --bad: #b42318;
    --button: #1d4ed8; --button-fg: #ffffff; --sol-bg: #f3f0fa;
  }
  html.dark {
    --bg: #1b1b1b; --fg: #e5e7eb; --muted: #b7bcc6; --card: #2b2b2b; --border: #4b5563;
    --head-bg: #2e2250; --head-fg: #ffffff; --accent: #c4b5fd; --accent-border: #8b74d6;
    --input-bg: #1f1f1f; --input-border: #9ca3af; --ok: #6ee7b7; --bad: #fca5a5;
    --button: #3b82f6; --button-fg: #ffffff; --sol-bg: #241c3d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { border: 1px solid var(--border); border-left: 5px solid var(--accent-border); border-radius: 8px;
          background: var(--card); overflow: hidden; }
  .head { background: var(--head-bg); color: var(--head-fg); padding: 10px 16px; font-weight: 700; font-size: 1.15em;
          display: flex; align-items: center; gap: 10px; }
  .head svg { width: 22px; height: 22px; }
  .body { padding: 16px; }
  .given { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 6px 0 14px; font-size: 1.05em; }
  .given span { white-space: nowrap; }
  i { font-style: italic; }
  .row { display: grid; grid-template-columns: 9.5em 11em 1fr; align-items: center; gap: 10px; margin: 8px 0; }
  .row label { font-size: 1.05em; }
  input[type="text"] { width: 100%; padding: 8px 10px; font: inherit; background: var(--input-bg); color: var(--fg);
                       border: 1px solid var(--input-border); border-radius: 6px; }
  input[type="text"]:focus { outline: 3px solid #93c5fd; outline-offset: 1px; }
  .mark { font-weight: 600; }
  .mark.ok { color: var(--ok); }
  .mark.bad { color: var(--bad); }
  .buttons { display: flex; gap: 12px; margin: 16px 0 14px; }
  button { font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 6px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  .primary { background: var(--button); color: var(--button-fg); border: 1px solid var(--button); }
  .secondary { background: transparent; color: var(--fg); border: 1px solid var(--input-border); }
  details { border: 1px solid var(--border); border-left: 4px solid var(--accent-border); border-radius: 6px;
            background: var(--sol-bg); }
  summary { cursor: pointer; padding: 10px 14px; font-weight: 700; color: var(--head-fg); font-size: 1.05em; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .solution { padding: 4px 16px 14px; }
  .solution p { margin: 6px 0; }
  .status { margin: 4px 0 0; color: var(--muted); min-height: 1.5em; }
  sub { font-size: 0.75em; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    Quick check: the planform from S, AR, and λ
  </div>
  <div class="body">
    <p>A wing has the area, aspect ratio, and taper ratio below. Compute its span, root chord, tip chord, and mean geometric chord. Give each value to one decimal.</p>
    <div class="given" aria-live="polite">
      <span><i>S</i> = <strong id="gS"></strong> ft²</span>
      <span>AR = <strong id="gAR"></strong></span>
      <span>λ = <strong id="gL"></strong></span>
    </div>
    <form id="qc" novalidate>
      <div class="row"><label for="b"><i>b</i> (ft) =</label><input type="text" id="b" inputmode="decimal" autocomplete="off"><span class="mark" id="mb" aria-live="polite"></span></div>
      <div class="row"><label for="cr"><i>c<sub>r</sub></i> (ft) =</label><input type="text" id="cr" inputmode="decimal" autocomplete="off"><span class="mark" id="mcr" aria-live="polite"></span></div>
      <div class="row"><label for="ct"><i>c<sub>t</sub></i> (ft) =</label><input type="text" id="ct" inputmode="decimal" autocomplete="off"><span class="mark" id="mct" aria-live="polite"></span></div>
      <div class="row"><label for="cm"><i>c<sub>MGC</sub></i> (ft) =</label><input type="text" id="cm" inputmode="decimal" autocomplete="off"><span class="mark" id="mcm" aria-live="polite"></span></div>
      <div class="buttons">
        <button type="submit" class="primary">Check answers</button>
        <button type="button" class="secondary" id="shuffle">Shuffle</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </form>
    <details id="sol">
      <summary>Solution</summary>
      <div class="solution" id="solution"></div>
    </details>
  </div>
</div>
<script>
(function () {
  // Follow the book's light or dark mode: the page is on the same origin, so the
  // parent's <html class="dark"> is readable. Fall back to the system setting.
  function syncTheme() {
    var dark = false;
    try { dark = window.parent.document.documentElement.classList.contains("dark"); }
    catch (e) { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}

  // Size the frame to the content (same origin, so the frame element is reachable),
  // so that the open solution is not cut off. The page CSS gives a fallback height.
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (document.documentElement.scrollHeight + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var S, AR, L, ans;
  function pick(min, max, step) { var n = Math.round((max - min) / step); return min + step * Math.floor(Math.random() * (n + 1)); }
  function fmt(x, d) { return Number(x).toFixed(d === undefined ? 1 : d); }
  function setProblem() {
    S = pick(200, 450, 10); AR = pick(4, 7, 0.5); L = pick(0.3, 0.6, 0.05);
    var b = Math.sqrt(AR * S), cr = 2 * S / (b * (1 + L)), ct = L * cr;
    var cm = 2 / 3 * cr * (1 + L + L * L) / (1 + L);
    ans = { b: b, cr: cr, ct: ct, cm: cm };
    document.getElementById("gS").textContent = S;
    document.getElementById("gAR").textContent = fmt(AR);
    document.getElementById("gL").textContent = fmt(L, 2);
    ["b", "cr", "ct", "cm"].forEach(function (k) {
      document.getElementById(k).value = "";
      var m = document.getElementById("m" + k); m.textContent = ""; m.className = "mark";
    });
    document.getElementById("status").textContent = "";
    document.getElementById("sol").open = false;
    document.getElementById("solution").innerHTML =
      "<p><i>b</i> = √(AR · <i>S</i>) = √(" + fmt(AR) + " × " + S + ") = <strong>" + fmt(b) + " ft</strong></p>" +
      "<p><i>c<sub>r</sub></i> = 2<i>S</i> / [<i>b</i>(1 + λ)] = 2 × " + S + " / [" + fmt(b, 2) + " × " + fmt(1 + L, 2) + "] = <strong>" + fmt(cr) + " ft</strong></p>" +
      "<p><i>c<sub>t</sub></i> = λ <i>c<sub>r</sub></i> = " + fmt(L, 2) + " × " + fmt(cr, 2) + " = <strong>" + fmt(ct) + " ft</strong></p>" +
      "<p><i>c<sub>MGC</sub></i> = (2/3) <i>c<sub>r</sub></i> (1 + λ + λ²) / (1 + λ) = (2/3) × " + fmt(cr, 2) + " × " +
      fmt(1 + L + L * L, 3) + " / " + fmt(1 + L, 2) + " = <strong>" + fmt(cm) + " ft</strong></p>" +
      "<p>The mean geometric chord sits between the tip and root chords, nearer the root for a tapered wing.</p>";
  }
  function check(e) {
    e.preventDefault();
    var right = 0, blank = 0;
    ["b", "cr", "ct", "cm"].forEach(function (k) {
      var raw = document.getElementById(k).value.trim().replace(",", ".");
      var m = document.getElementById("m" + k);
      if (raw === "") { blank++; m.textContent = "no answer"; m.className = "mark bad"; return; }
      var v = parseFloat(raw), a = ans[k];
      var ok = isFinite(v) && Math.abs(v - a) <= Math.max(0.011 * a, 0.06);
      if (ok) right++;
      m.textContent = ok ? "✓ correct" : "✗ try again";
      m.className = "mark " + (ok ? "ok" : "bad");
    });
    document.getElementById("status").textContent =
      right === 4 ? "All four correct." : right + " of 4 correct" + (blank ? ", " + blank + " blank" : "") + ". Open the solution if you are stuck.";
  }
  document.getElementById("qc").addEventListener("submit", check);
  document.getElementById("shuffle").addEventListener("click", setProblem);
  setProblem();
})();
</script>
</body>
</html>
