# Jupyter Book 2 (MyST) configuration for the AAE 451 Advanced Aircraft Design lecture notes.
# Build locally:   jupyter-book start        (live preview)
#                  jupyter-book build --html (static site in _build/html)
version: 1
project:
  id: aae451-advanced-aircraft-design-notes
  title: AAE 451 Advanced Aircraft Design
  subtitle: Lecture notes, Navy Jet Trainer
  description: Lecture notes for AAE 451 Advanced Aircraft Design at Purdue University, written around the AIAA 2026-27 Navy Jet Trainer request for proposal.
  keywords:
    - aircraft design
    - conceptual design
    - requirements
    - Navy jet trainer
  authors:
    - name: Thiago Guimaraes
      affiliations:
        - Purdue University, School of Aeronautics and Astronautics
  github: https://github.com/ThiagoPurdue/AAE451_Advanced_Design_Notes
  # Live code cells: Thebe connects the reader's browser to a kernel on mybinder.org,
  # built from the binder/ folder of this repository (GNU Octave runs the MATLAB code).
  # For a Jupyter server with the MATLAB kernel, replace `binder` with
  #   server: { url: https://<host>, token: <token> }  and kernelName: jupyter_matlab_kernel
  thebe:
    binder:
      url: https://mybinder.org/
      repo: ThiagoPurdue/AAE451_Advanced_Design_Notes
      ref: main
      provider: github
    kernelName: octave
  exclude:
    - README.md
    - binder/**
    - scripts/**
    - notes/_parts/**
    - notes/_static/**
  toc:
    - file: notes/index.md
    - file: notes/navy-rfp/navy-rfp.md
    - title: "Lecture 1: Introduction to Aircraft Design"
      children:
        - file: notes/lecture-01/design-process.md
        - file: notes/lecture-01/needs-and-conops.md
        - file: notes/lecture-01/requirements.md
    - title: "Lecture 2: Aircraft Sizing"
      children:
        - file: notes/lecture-02/weight-estimation.md
        - file: notes/lecture-02/mission-fuel.md
        - file: notes/lecture-02/sizing-loop.ipynb
    - title: "Lecture 3: Aircraft Configuration"
      children:
        - file: notes/lecture-03/configuration.md
    - title: "Lecture 4: Concept Generation and Selection"
      children:
        - file: notes/lecture-04/concept-selection.md
    - title: Assignments
      children:
        - file: notes/assignments/a01.md
        - file: notes/assignments/a02.md
        - file: notes/assignments/a03.md
    - file: notes/glossary.md
    - file: notes/accessibility.md
site:
  template: book-theme
  options:
    logo_text: AAE 451 Advanced Aircraft Design
    hide_authors: true
    style: notes/_static/site.css
  parts:
    primary_sidebar_footer: notes/_parts/sidebar-footer.md
