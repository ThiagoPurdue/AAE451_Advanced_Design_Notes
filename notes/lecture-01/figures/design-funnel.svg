   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #a04f00" x="304.7256" y="40.667194" transform="rotate(-0 304.7256 40.667194)">Conceptual Design</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(210.767006 57.850185)">What requirements drive the design?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(203.518413 71.404857)">What should it look like? Weight? Cost?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(207.98185 84.773122)">What tradeoffs should be considered?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(213.627631 98.193029)">What technologies should be used?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(197.338959 111.747702)">Do these requirements produce a viable &amp;</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(267.642592 125.167609)">salable plane?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #a04f00" x="304.7256" y="179.158103" transform="rotate(-0 304.7256 179.158103)">Preliminary Design</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(242.721733 196.505625)">Freeze the configuration</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(217.796381 210.060297)">Develop lofting (surface definition)</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(210.752631 223.428562)">Develop test and analytical database</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(255.519077 236.796827)">Design major items</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(202.149194 250.3515)">Develop actual cost estimate (statistical)</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(240.062358 263.906172)">(“You bet your company”)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #a04f00" x="304.7256" y="317.813543" transform="rotate(-0 304.7256 317.813543)">Detail Design</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(225.140209 335.020908)">Design actual pieces to be built</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(207.243334 348.575581)">Design tooling and fabrication process</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(191.92767 361.943846)">Test major items - structure, landing gear, …</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(195.42978 375.498519)">Finalize weight and performance estimates</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(215.2556 389.062751)">(NOW you learn the real numbers!)</text>
   </g>
