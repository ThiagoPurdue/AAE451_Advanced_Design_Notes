   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="275.85" y="87.030405" transform="rotate(-0 275.85 87.030405)">Conceptual design</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(181.891406 108.396351)">What requirements drive the design?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(174.642813 121.699874)">What should it look like? Weight? Cost?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(177.19168 134.821195)">What trade-offs should be considered?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(184.752031 147.989952)">What technologies should be used?</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(130.751445 161.293476)">Do these requirements give a viable and salable aircraft?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="275.85" y="206.581824" transform="rotate(-0 275.85 206.581824)">Preliminary design</text>
