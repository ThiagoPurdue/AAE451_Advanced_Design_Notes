   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(194.688 49.146741)">Air transportation or defense system: aircraft, missiles,</text>
    <text style="font-size: 12px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(194.688 63.028678)">satellites, ground stations, airports, air traffic management</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="99.47925" y="114.023615" transform="rotate(-0 99.47925 114.023615)">Level 2</text>
   </g>
