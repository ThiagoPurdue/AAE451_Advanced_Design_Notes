   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 258.768934)">Wing, fuselage, tail, landing gear, radar, pumps, nacelles,</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 272.650872)">control surfaces, auxiliary power unit</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="125.0505" y="323.645809" transform="rotate(-0 125.0505 323.645809)">Level 5</text>
