   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(194.688 186.421745)">Flight control, hydraulic, electric, avionics, powerplant,</text>
