   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(194.688 117.820805)">The aircraft and related systems: operators, trainers,</text>
    <text style="font-size: 12px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(194.688 131.702743)">manufacturing plants, maintenance shops</text>
   </g>
