   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 327.513311)">Fittings, fasteners, blades, screws, nuts, ribs, spars,</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 341.395249)">frames, stiffeners, skin, shafts, pipes, propellers</text>
