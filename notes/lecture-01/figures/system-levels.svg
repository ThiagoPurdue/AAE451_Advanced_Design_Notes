   <g id="text_2">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="95.7555" y="71.262762" transform="rotate(-0 95.7555 71.262762)">System of systems</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 52.746741)">Air transportation or defense system: aircraft, missiles,</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 66.628678)">satellites, ground stations, airports, air traffic management</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="103.07925" y="117.623615" transform="rotate(-0 103.07925 117.623615)">Level 2</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="103.07925" y="139.936827" transform="rotate(-0 103.07925 139.936827)">System</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 121.420805)">The aircraft and related systems: operators, trainers,</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 135.302743)">manufacturing plants, maintenance shops</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="110.403" y="186.29768" transform="rotate(-0 110.403 186.29768)">Level 3</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="110.403" y="208.610891" transform="rotate(-0 110.403 208.610891)">Subsystem</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 190.021745)">Flight control, hydraulic, electric, avionics, powerplant,</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(198.288 203.903682)">fuel, air conditioning, structure</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="117.72675" y="254.971744" transform="rotate(-0 117.72675 254.971744)">Level 4</text>
   </g>
   <g id="text_11">
