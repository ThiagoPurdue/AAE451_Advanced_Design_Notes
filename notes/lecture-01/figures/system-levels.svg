   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(194.688 255.168934)">Wing, fuselage, tail, landing gear, radar, pumps, nacelles,</text>
