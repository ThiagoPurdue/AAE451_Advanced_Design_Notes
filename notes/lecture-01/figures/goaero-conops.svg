   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="318.19957" y="45.933731" transform="rotate(-0 318.19957 45.933731)">Competition vehicle</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(222.334492 60.057084)">Semi-autonomous aircraft that carries</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(224.870781 72.632065)">one passenger or a medium payload</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="67.09957" y="45.933731" transform="rotate(-0 67.09957 45.933731)">GPS</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(44.409531 60.057084)">Accurate</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(26.821719 72.632065)">positioning data</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="541.39957" y="145.725731" transform="rotate(-0 541.39957 145.725731)">Areas of operation</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(456.396602 159.989241)">Fly to and from objects of interest</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(466.610039 172.698987)">with autonomous recognition,</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(465.32707 185.408733)">adapting to diverse conditions</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="89.41957" y="234.429731" transform="rotate(-0 89.41957 234.429731)">Obstacles</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(10.8 248.553084)">The vehicle navigates complex</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(16.55 261.26283)">obstacle environments using</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(46.590156 273.972577)">onboard sensors</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="301.45957" y="356.397731" transform="rotate(-0 301.45957 356.397731)">Transportation</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(211.653555 370.661241)">Ground transport brings the vehicle</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(228.257578 383.370987)">and the ground station to the</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(257.987773 396.255928)">area of operation</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="541.39957" y="323.133731" transform="rotate(-0 541.39957 323.133731)">Ground station</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(467.256016 337.257084)">Command and control center</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(488.348633 350.00726)">for the operator to fly</text>
    <text style="font-size: 11.5px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(513.911875 362.717006)">the vehicle</text>
   </g>
