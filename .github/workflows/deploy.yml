name: Deploy the book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The site is served from https://<user>.github.io/<repository>/
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book 2
        # Pinned to the version the accessibility fixes were tested with.
        run: pip install "jupyter-book==2.1.7"
      - name: Build the HTML site
        run: jupyter-book build --html
      - name: Fix theme accessibility issues
        run: |
          python scripts/fix_theme_a11y.py _build/html
          cp -R quickcheck _build/html/quickcheck
      - name: Check accessibility (WCAG 2.1 AA, axe-core)
        run: |
          mkdir -p /tmp/a11y && cd /tmp/a11y
          npm init -y > /dev/null
          npm install --no-audit --no-fund axe-core@4.14.0 puppeteer-core@25.16.0
          CHROME=$(command -v google-chrome) node "$GITHUB_WORKSPACE/scripts/check_accessibility.mjs" "$GITHUB_WORKSPACE/_build/html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
